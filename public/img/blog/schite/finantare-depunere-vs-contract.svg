<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568.9" font-family="Inter, Arial, sans-serif"><rect width="1200" height="568.9" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Ce trebuie la depunere, ce poate aștepta</text><text x="40" y="82" font-size="17" fill="#64748b">Documentația tehnică într-un dosar de finanțare pentru infrastructură</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">La depunere</text><rect x="40" y="180" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Documentația tehnico-economică aprobată prin hotărâre,</text><text x="58" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">nu doar recepționată</text><rect x="40" y="256.2" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Indicatorii tehnico-economici, corelați cu bugetul</text><text x="58" y="306.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">cererii</text><rect x="40" y="332.4" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="360.4" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Situația juridică a terenului clarificată</text><rect x="40" y="386.5" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="414.5" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Studiile de fundamentare: topografic, geotehnic, după</text><text x="58" y="436.6" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">caz hidrologic și de trafic</text><rect x="40" y="462.7" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="490.7" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Expertiza tehnică, pentru intervențiile pe construcții</text><text x="58" y="512.8" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">existente</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">După contractare</text><rect x="612" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Proiectul tehnic de execuție și detaliile</text><rect x="612" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Documentația pentru autorizare și autorizația</text><rect x="612" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Verificarea tehnică a proiectului</text><rect x="612" y="342.30000000000007" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="370.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Procedura de achiziție a execuției</text></svg>
