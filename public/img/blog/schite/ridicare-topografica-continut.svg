<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 527.3000000000002" font-family="Inter, Arial, sans-serif"><rect width="1200" height="527.3000000000002" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Ce trebuie să apară în ridicarea topografică</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 265 alin. (2) lit. d) și anexa nr. 2</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Cerut de lege</text><rect x="40" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Stereo 70, recepționat de oficiul de cadastru</text><rect x="40" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Relieful și numărul cadastral</text><rect x="40" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Repere de trasare, rețele, cămine, stâlpi</text><rect x="40" y="342.30000000000007" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="370.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Împrejmuiri cotate pe verticală, arbori</text><rect x="40" y="396.4000000000001" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="424.4000000000001" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Spațiul public din care se face accesul</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Lipsește des</text><rect x="612" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Cotele străzii: ax, bordură, rigolă sau șanț</text><rect x="612" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Căminele cu cota de capac și de radier</text><rect x="612" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">O fâșie din terenul vecinilor</text><rect x="612" y="342.30000000000007" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="370.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Puncte destul de dese pe teren în pantă</text><text x="40" y="476.5000000000001" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Traseul exact al rețelelor subterane vine din avizul operatorului.</text></svg>
