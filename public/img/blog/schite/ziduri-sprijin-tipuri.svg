<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e7dcc8"/><circle cx="4" cy="4" r="1.6" fill="#b8a582"/><circle cx="11" cy="10" r="1.3" fill="#b8a582"/>
    </pattern>
    <pattern id="conc" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#cbd5e1"/><circle cx="5" cy="6" r="1.2" fill="#94a3b8"/><circle cx="12" cy="12" r="1" fill="#94a3b8"/>
    </pattern>
    <pattern id="gab" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#d6d3d1"/><circle cx="5" cy="5" r="4" fill="#a8a29e"/><circle cx="12" cy="12" r="3.5" fill="#a8a29e"/>
      <path d="M0,0 L16,16 M16,0 L0,16" stroke="#57534e" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="790" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Patru feluri de a ține pământul</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Secțiuni de principiu, fără scară. Terenul reținut e în dreapta fiecărei lucrări.</text>

  <!-- 1 greutate -->
  <g transform="translate(40 110)">
    <rect x="0" y="0" width="260" height="330" fill="#f1f5f9" rx="10"/>
    <path d="M150,60 L260,60 L260,300 L150,300 Z" fill="url(#earth)"/>
    <path d="M60,300 L150,300 L150,60 L115,60 Z" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="300" width="260" height="30" fill="url(#earth)"/>
    <text x="130" y="365" font-size="19" font-weight="700" fill="#0a1628" text-anchor="middle">De greutate</text>
    <text x="130" y="388" font-size="14" fill="#64748b" text-anchor="middle">se ține prin propria masă</text>
  </g>
  <!-- 2 consolă -->
  <g transform="translate(330 110)">
    <rect x="0" y="0" width="260" height="330" fill="#f1f5f9" rx="10"/>
    <path d="M115,60 L260,60 L260,300 L115,300 Z" fill="url(#earth)"/>
    <rect x="100" y="60" width="22" height="215" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
    <rect x="60" y="275" width="170" height="25" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
    <path d="M122,90 L230,90 L230,275 L122,275" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="176" y="185" font-size="13" fill="#b45309" text-anchor="middle">greutatea</text>
    <text x="176" y="201" font-size="13" fill="#b45309" text-anchor="middle">pământului</text>
    <text x="176" y="217" font-size="13" fill="#b45309" text-anchor="middle">pe talpă</text>
    <rect x="0" y="300" width="260" height="30" fill="url(#earth)"/>
    <text x="130" y="365" font-size="19" font-weight="700" fill="#0a1628" text-anchor="middle">Beton armat în consolă</text>
    <text x="130" y="388" font-size="14" fill="#64748b" text-anchor="middle">cere spațiu de săpătură în spate</text>
  </g>
  <!-- 3 gabioane -->
  <g transform="translate(620 110)">
    <rect x="0" y="0" width="260" height="330" fill="#f1f5f9" rx="10"/>
    <path d="M150,60 L260,60 L260,300 L150,300 Z" fill="url(#earth)"/>
    <rect x="70" y="240" width="90" height="60" fill="url(#gab)" stroke="#57534e" stroke-width="2"/>
    <rect x="90" y="180" width="70" height="60" fill="url(#gab)" stroke="#57534e" stroke-width="2"/>
    <rect x="110" y="120" width="50" height="60" fill="url(#gab)" stroke="#57534e" stroke-width="2"/>
    <rect x="125" y="60" width="35" height="60" fill="url(#gab)" stroke="#57534e" stroke-width="2"/>
    <rect x="0" y="300" width="260" height="30" fill="url(#earth)"/>
    <text x="130" y="365" font-size="19" font-weight="700" fill="#0a1628" text-anchor="middle">Gabioane</text>
    <text x="130" y="388" font-size="14" fill="#64748b" text-anchor="middle">flexibile, drenante; limita e sârma</text>
  </g>
  <!-- 4 pământ armat -->
  <g transform="translate(910 110)">
    <rect x="0" y="0" width="260" height="330" fill="#f1f5f9" rx="10"/>
    <path d="M70,60 L260,60 L260,300 L70,300 Z" fill="url(#earth)"/>
    <rect x="62" y="60" width="12" height="240" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
    <g stroke="#1e3a5f" stroke-width="3">
      <line x1="74" y1="90" x2="205" y2="90"/><line x1="74" y1="130" x2="205" y2="130"/><line x1="74" y1="170" x2="205" y2="170"/><line x1="74" y1="210" x2="205" y2="210"/><line x1="74" y1="250" x2="205" y2="250"/><line x1="74" y1="285" x2="205" y2="285"/>
    </g>
    <text x="140" y="80" font-size="12" fill="#1e3a5f" text-anchor="middle">≈ 0,7 × înălțimea</text>
    <rect x="0" y="300" width="260" height="30" fill="url(#earth)"/>
    <text x="130" y="365" font-size="19" font-weight="700" fill="#0a1628" text-anchor="middle">Pământ armat</text>
    <text x="130" y="388" font-size="14" fill="#64748b" text-anchor="middle">geogrile în umplutură</text>
  </g>

  <!-- stabilitate generală -->
  <g transform="translate(40 560)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#b91c1c">Greșeala care nu se vede în calcul</text>
    <path d="M0,40 L260,40 L420,130 L600,130 L600,200 L0,200 Z" fill="url(#earth)"/>
    <path d="M300,128 L330,128 L312,60 L300,60 Z" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
    <path d="M120,40 C180,210 430,220 560,130" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="640" y="80" font-size="16" fill="#0a1628">Zidul trece verificările la răsturnare, lunecare</text>
    <text x="640" y="102" font-size="16" fill="#0a1628">și capacitate portantă, dar suprafața de alunecare</text>
    <text x="640" y="124" font-size="16" fill="#0a1628">trece pe sub fundație. Pleacă întreg, cu versantul.</text>
    <text x="640" y="160" font-size="15" fill="#64748b">Stabilitatea generală se verifică pe baza unui studiu</text>
    <text x="640" y="180" font-size="15" fill="#64748b">geotehnic care ajunge suficient de adânc.</text>
  </g>
</svg>
