<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550.2" font-family="Inter, Arial, sans-serif"><rect width="1200" height="550.2" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Documentațiile complementare care contează pentru drumuri</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 265 alin. (2), după specificul lucrării</text><rect x="40" y="120" width="1120" height="46.8" rx="10" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5"/><text x="56" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Lit.</text><text x="192.58536585365854" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Document</text><text x="629.6585365853659" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">De ce contează</text><rect x="40" y="174.8" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="208.10000000000002" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">a)</text><text x="192.58536585365854" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Studiul geotehnic, cu referat Af</text><text x="629.6585365853659" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Pe ce teren stă platforma, dacă apa se infiltrează</text><rect x="40" y="230.9" width="1120" height="70.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="264.2" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">b)</text><text x="192.58536585365854" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Expertiza privind vecinătățile</text><text x="629.6585365853659" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Săpătura sau construcția poate afecta clădirile de</text><text x="629.6585365853659" y="286.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">alături</text><rect x="40" y="309.1" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="56" y="342.40000000000003" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">d)</text><text x="192.58536585365854" y="342.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Studiul topografic Stereo 70</text><text x="629.6585365853659" y="342.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Baza pentru cote, accese și sistematizare verticală</text><rect x="40" y="365.20000000000005" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="398.50000000000006" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">i)</text><text x="192.58536585365854" y="398.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Autorizația pentru vegetație</text><text x="629.6585365853659" y="398.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Arbori tăiați pe amplasament</text><rect x="40" y="421.30000000000007" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="454.6000000000001" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">m)</text><text x="192.58536585365854" y="454.6000000000001" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Studiul de circulație</text><text x="629.6585365853659" y="454.6000000000001" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Numai în cazurile justificate legal</text><text x="40" y="499.4000000000001" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Responsabilitatea potrivirii proiectului cu ele revine echipei de specialiști (alin. (9)).</text></svg>
