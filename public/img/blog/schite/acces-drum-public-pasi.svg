<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 689" font-family="Inter, Arial, sans-serif"><rect width="1200" height="689" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Un acces nou din drumul public, pe pași</text><text x="40" y="82" font-size="17" fill="#64748b">OG nr. 43/1997, art. 46, și CATUC, art. 266</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Certificatul de urbanism cere acordul de racordare</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">acord de racordare la rețeaua căilor de comunicații (art. 266)</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="251.29999999999998" r="17" fill="#d97706"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Discuție cu administratorul drumului pe o schiță de acces</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">înainte de proiectul complet</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Acordul prealabil al administratorului drumului</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">permite accesul în principiu, pe baza proiectului</text><rect x="40" y="396.59999999999997" width="1120" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="428.59999999999997" r="17" fill="#1e3a5f"/><text x="74" y="433.59999999999997" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Autorizația de construire</text><rect x="40" y="474.59999999999997" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="513.6999999999999" r="17" fill="#1e3a5f"/><text x="74" y="518.6999999999999" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="508.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Autorizația de amplasare și/sau de acces în zona drumului</text><text x="106" y="535.3" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">se eliberează după încheierea contractului cu administratorul</text><rect x="40" y="566.8" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="605.9" r="17" fill="#1e3a5f"/><text x="74" y="610.9" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="106" y="600.8" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Execuția, pentru funcțiunea aprobată</text><text x="106" y="627.5" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">schimbarea destinației cere aprobarea administratorului</text></svg>
