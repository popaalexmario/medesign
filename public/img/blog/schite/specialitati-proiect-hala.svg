<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494.1" font-family="Inter, Arial, sans-serif"><rect width="1200" height="494.1" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Cine face ce în proiectul unei hale cu platformă</text><text x="40" y="82" font-size="17" fill="#64748b">Împărțirea obișnuită a specialităților</text><rect x="40" y="120" width="1120" height="46.8" rx="10" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5"/><text x="56" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Specialitatea</text><text x="367.1111111111111" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Ce acoperă</text><rect x="40" y="174.8" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="208.10000000000002" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Arhitectură</text><text x="367.1111111111111" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Clădirea, planul de situație, cota ±0,00, coordonarea proiectului</text><rect x="40" y="230.9" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="264.2" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Structură</text><text x="367.1111111111111" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rezistența clădirii și fundațiile</text><rect x="40" y="287" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="320.3" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Instalații</text><text x="367.1111111111111" y="320.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Instalațiile interioare și rețelele până la branșament</text><rect x="40" y="343.1" width="1120" height="70.2" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="56" y="376.40000000000003" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Drumuri</text><text x="367.1111111111111" y="376.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Accesul și racordul la drum, circulații, platforme, parcări, sistematizare verticală,</text><text x="367.1111111111111" y="398.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">ape pluviale de suprafață, semnalizare</text><text x="40" y="443.3" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Granița cu instalațiile se stabilește clar la canalizarea pluvială.</text></svg>
