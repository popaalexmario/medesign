<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502.6000000000001" font-family="Inter, Arial, sans-serif"><rect width="1200" height="502.6000000000001" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Organizarea de șantier după CATUC</text><text x="40" y="82" font-size="17" fill="#64748b">Art. 517: proiect întocmit de antreprenorul general, supus autorizării</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Ce cuprinde</text><rect x="40" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Împrejmuire și accesuri</text><rect x="40" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rampă de spălare: platformă betonată, apa colectată</text><rect x="40" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Depozite de materiale și de deșeuri</text><rect x="40" y="342.30000000000007" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="370.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Ocuparea temporară a drumului, doar dacă e absolut</text><text x="58" y="392.4000000000001" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">necesar</text><rect x="40" y="418.50000000000006" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="446.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Avize pentru utilități și contract pentru deșeuri</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Obligațiile executantului</text><rect x="612" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Obține avizele și acordurile</text><rect x="612" y="234.1" width="548" height="66.20000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Construiește doar pe terenurile proprii, la minimul</text><text x="630" y="284.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">necesar</text><rect x="612" y="310.3" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="338.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Readuce terenurile ocupate la forma inițială</text></svg>
