<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 597.5000000000001" font-family="Inter, Arial, sans-serif"><rect width="1200" height="597.5000000000001" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Contractul de proiectare: ce verifici</text><text x="40" y="82" font-size="17" fill="#64748b">Lista din articol, cu temeiul din CATUC</text><rect x="40" y="120" width="1120" height="46.8" rx="10" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5"/><text x="56" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Ce</text><text x="419.2432432432432" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">De verificat</text><rect x="40" y="174.8" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="208.10000000000002" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Faze</text><text x="419.2432432432432" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">PAC, PTE, SF sau DALI, scrise explicit</text><rect x="40" y="230.9" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="264.2" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Studii</text><text x="419.2432432432432" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Topografie, geotehnic: incluse sau comandate de tine</text><rect x="40" y="287" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="320.3" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Coordonare</text><text x="419.2432432432432" y="320.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Cine e șef de proiect la contracte separate (art. 433)</text><rect x="40" y="343.1" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="376.40000000000003" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Verificare</text><text x="419.2432432432432" y="376.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Pe ce cerințe, cine plătește</text><rect x="40" y="399.20000000000005" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="56" y="432.50000000000006" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Asistență tehnică</text><text x="419.2432432432432" y="432.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Deplasări, timp de răspuns, faze determinante (art. 426)</text><rect x="40" y="455.30000000000007" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="488.6000000000001" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">As-built</text><text x="419.2432432432432" y="488.6000000000001" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Cine îl face și cât de detaliat (art. 528)</text><rect x="40" y="511.4000000000001" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="544.7" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Asigurare RC</text><text x="419.2432432432432" y="544.7" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Polița de răspundere profesională (art. 570)</text></svg>
