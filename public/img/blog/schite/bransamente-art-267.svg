<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582.5999999999999" font-family="Inter, Arial, sans-serif"><rect width="1200" height="582.5999999999999" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Branșamentele care traversează drumul</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 266 și 267</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Certificatul de urbanism cere avizele de amplasament ale operatorilor</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">unde sunt rețelele și cum te racordezi (art. 266 lit. e))</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="251.29999999999998" r="17" fill="#1e3a5f"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Proiectul arată traseul racordurilor pe domeniul public</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">planul construcțiilor subterane, anexa nr. 2</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Cererea pentru acordul administratorului drumului</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">emis de autoritatea locală competentă (art. 267 alin. (1))</text><rect x="40" y="396.59999999999997" width="1120" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="428.59999999999997" r="17" fill="#d97706"/><text x="74" y="433.59999999999997" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Autorizația de construire și acordul pentru racorduri se emit concomitent</text><rect x="40" y="474.59999999999997" width="1120" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="506.59999999999997" r="17" fill="#1e3a5f"/><text x="74" y="511.59999999999997" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="508.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Un acord refuzat pentru o utilitate nu blochează celelalte autorizații</text></svg>
