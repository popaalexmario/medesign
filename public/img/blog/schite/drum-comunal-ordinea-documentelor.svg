<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 559.4" font-family="Inter, Arial, sans-serif"><rect width="1200" height="559.4" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Modernizarea unui drum comunal, în ordine</text><text x="40" y="82" font-size="17" fill="#64748b">Pașii din articol, de la teren la autorizație</text><rect x="40" y="120" width="545" height="64" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="152" r="17" fill="#d97706"/><text x="74" y="157" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Clarifici situația juridică a terenului</text><rect x="40" y="198" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="230" r="17" fill="#1e3a5f"/><text x="74" y="235" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="232" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Soliciți certificatul de urbanism</text><rect x="40" y="276" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="308" r="17" fill="#1e3a5f"/><text x="74" y="313" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="310" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Comanzi studiile de teren</text><rect x="40" y="354" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="386" r="17" fill="#1e3a5f"/><text x="74" y="391" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="388" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Comanzi expertiza tehnică, dacă drumul există</text><rect x="40" y="432" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="464" r="17" fill="#1e3a5f"/><text x="74" y="469" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="466" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Soliciți avizele din lista CU</text><rect x="615" y="120" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="649" cy="152" r="17" fill="#1e3a5f"/><text x="649" y="157" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="681" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Comanzi DALI sau SF</text><rect x="615" y="198" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="649" cy="230" r="17" fill="#1e3a5f"/><text x="649" y="235" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="681" y="232" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Aprobi indicatorii tehnico-economici</text><rect x="615" y="276" width="545" height="83.4" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="649" cy="317.7" r="17" fill="#1e3a5f"/><text x="649" y="322.7" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="681" y="310" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Comanzi proiectul tehnic și documentația</text><text x="681" y="334.7" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">pentru autorizare</text><rect x="615" y="373.4" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="649" cy="405.4" r="17" fill="#1e3a5f"/><text x="649" y="410.4" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="681" y="407.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Asiguri verificarea de proiect</text><rect x="615" y="451.4" width="545" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="649" cy="483.4" r="17" fill="#1e3a5f"/><text x="649" y="488.4" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="681" y="485.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Depui pentru autorizație</text></svg>
