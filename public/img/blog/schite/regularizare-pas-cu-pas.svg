<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 653.8" font-family="Inter, Arial, sans-serif"><rect width="1200" height="653.8" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Autorizația de regularizare, pas cu pas</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 301, fereastra până în august 2027</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Ridicare topografică a ce s-a construit</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">cote, poziții, limite de proprietate</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="251.29999999999998" r="17" fill="#d97706"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Discuția la urbanism</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">se încadrează lucrarea în reglementări? (alin. (7))</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Expertize tehnice pe cerințele fundamentale</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">experți atestați (alin. (9))</text><rect x="40" y="396.59999999999997" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="435.7" r="17" fill="#1e3a5f"/><text x="74" y="440.7" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Lucrări de aducere la conformitate, dacă se cer</text><text x="106" y="457.29999999999995" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">cu proiect (alin. (10))</text><rect x="40" y="488.79999999999995" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="527.9" r="17" fill="#1e3a5f"/><text x="74" y="532.9" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="522.8" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Obligații fiscale și măsuri contravenționale</text><text x="106" y="549.5" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">taxe și cote de zece ori (alin. (7)–(8))</text><text x="40" y="603" font-size="16" font-weight="400" fill="#475569" text-anchor="start">După termen: desființare de către autoritate sau prin instanță (alin. (12)).</text></svg>
