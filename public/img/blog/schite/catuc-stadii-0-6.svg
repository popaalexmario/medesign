<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 412.59999999999997" font-family="Inter, Arial, sans-serif"><rect width="1200" height="412.59999999999997" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Cele șapte stadii ale unei investiții după CATUC</text><text x="40" y="82" font-size="17" fill="#64748b">Stadiile înlocuiesc vechile faze de proiectare</text><rect x="230" y="138" width="570" height="34" rx="17" fill="#d97706" opacity="0.15"/><text x="515" y="161" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Proiectantul răspunde de stadiile 1–4 (art. 424)</text><line x1="60" y1="250" x2="1140" y2="250" stroke="#1e3a5f" stroke-width="5"/><circle cx="90" cy="250" r="20" fill="#1e3a5f"/><text x="90" y="255" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">0</text><text x="90" y="302" font-size="17" font-weight="700" fill="#0a1628" text-anchor="middle">Definirea</text><text x="90" y="324.1" font-size="17" font-weight="700" fill="#0a1628" text-anchor="middle">strategică</text><text x="90" y="348.2" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">stadiul</text><text x="90" y="366.4" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">beneficiarului</text><circle cx="260" cy="250" r="20" fill="#1e3a5f"/><text x="260" y="255" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="260" y="302" font-size="17" font-weight="700" fill="#0a1628" text-anchor="middle">Tema și</text><text x="260" y="324.1" font-size="17" font-weight="700" fill="#0a1628" text-anchor="middle">fezabilitatea</text><text x="260" y="348.2" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">CU, studii de</text><text x="260" y="366.4" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">amplasament</text><circle cx="430" cy="250" r="20" fill="#1e3a5f"/><text x="430" y="255" font-size="19" font-weight="700" fill="#fff" text-a