<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="clay" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#e9d8b8"/><line x1="0" y1="8" x2="16" y2="8" stroke="#c9b48c" stroke-width="1.5"/>
    </pattern>
    <pattern id="sand" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f3e6b0"/><circle cx="3" cy="3" r="1.4" fill="#c7b066"/><circle cx="9" cy="8" r="1.2" fill="#c7b066"/>
    </pattern>
    <pattern id="soft" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#9fb4a3"/><path d="M0,9 q4.5,-5 9,0 t9,0" stroke="#6b8670" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="marl" width="20" height="14" patternUnits="userSpaceOnUse">
      <rect width="20" height="14" fill="#a3a8b4"/><line x1="0" y1="0" x2="20" y2="0" stroke="#7c8291" stroke-width="2"/><line x1="10" y1="0" x2="10" y2="7" stroke="#7c8291" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Ce vede un foraj și ce rămâne între foraje</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Profil geotehnic în lungul unui traseu de drum, schiță de principiu, fără scară</text>

  <!-- straturi -->
  <path d="M40,200 C250,185 450,215 650,195 C850,178 1000,205 1160,190 L1160,620 L40,620 Z" fill="url(#clay)"/>
  <path d="M40,330 C300,320 500,345 700,330 C900,318 1050,340 1160,330 L1160,620 L40,620 Z" fill="url(#sand)"/>
  <path d="M40,470 C300,460 600,480 800,465 C950,455 1060,470 1160,462 L1160,620 L40,620 Z" fill="url(#marl)"/>
  <!-- lentilă de argilă moale între F2 și F3 -->
  <path d="M470,345 C520,320 640,318 700,340 C720,380 690,420 600,425 C520,428 455,400 470,345 Z" fill="url(#soft)" stroke="#4d6b55" stroke-width="2"/>
  <!-- linie teren + drum -->
  <path d="M40,200 C250,185 450,215 650,195 C850,178 1000,205 1160,190" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- ape subterane -->
  <path d="M40,300 C300,292 600,305 900,296 C1000,293 1100,298 1160,296" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="12 8"/>
  <path d="M40,250 C300,244 600,256 900,248 C1000,245 1100,250 1160,248" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- foraje -->
  <g stroke="#0a1628" stroke-width="10" stroke-linecap="butt">
    <line x1="180" y1="192" x2="180" y2="520"/>
    <line x1="420" y1="203" x2="420" y2="300"/>
    <line x1="760" y1="186" x2="760" y2="510"/>
    <line x1="1020" y1="200" x2="1020" y2="500"/>
  </g>
  <g font-size="18" font-weight="700" fill="#0a1628" text-anchor="middle">
    <text x="180" y="176">F1</text><text x="420" y="186">F2</text><text x="760" y="170">F3</text><text x="1020" y="184">F4</text>
  </g>

  <!-- numere -->
  <g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="590" cy="375" r="17" fill="#b91c1c"/><text x="590" y="381">1</text>
    <circle cx="420" cy="330" r="17" fill="#d97706"/><text x="420" y="336">2</text>
    <circle cx="1100" cy="222" r="17" fill="#2563eb"/><text x="1100" y="228">3</text>
    <circle cx="1100" cy="320" r="17" fill="#2563eb"/><text x="1100" y="326">3</text>
    <circle cx="180" cy="555" r="17" fill="#1e3a5f"/><text x="180" y="561">4</text>
  </g>

  <!-- legendă -->
  <g font-size="17" fill="#0a1628" transform="translate(40 660)">
    <circle cx="14" cy="-6" r="13" fill="#b91c1c"/><text x="14" y="0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="36" y="0">Lentilă de argilă moale între două foraje: nu apare în studiu</text>
    <circle cx="14" cy="28" r="13" fill="#d97706"/><text x="14" y="34" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="36" y="34">Foraj oprit prea sus: nu ajunge la stratul care contează</text>
    <circle cx="634" cy="-6" r="13" fill="#2563eb"/><text x="634" y="0" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="656" y="0">Apa subterană: linie plină primăvara, punctată vara</text>
    <circle cx="634" cy="28" r="13" fill="#1e3a5f"/><text x="634" y="34" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="656" y="34">Foraj dus până în stratul de bază, sub zona de influență</text>
  </g>
  <g font-size="15" fill="#475569">
    <rect x="40" y="712" width="22" height="16" fill="url(#clay)" stroke="#94a3b8"/><text x="70" y="725">argilă prăfoasă</text>
    <rect x="210" y="712" width="22" height="16" fill="url(#sand)" stroke="#94a3b8"/><text x="240" y="725">nisip</text>
    <rect x="320" y="712" width="22" height="16" fill="url(#soft)" stroke="#94a3b8"/><text x="350" y="725">argilă moale</text>
    <rect x="480" y="712" width="22" height="16" fill="url(#marl)" stroke="#94a3b8"/><text x="510" y="725">marnă, strat de bază</text>
  </g>
</svg>
