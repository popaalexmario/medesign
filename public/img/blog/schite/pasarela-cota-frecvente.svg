<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e7dcc8"/><circle cx="4" cy="4" r="1.6" fill="#b8a582"/><circle cx="11" cy="10" r="1.3" fill="#b8a582"/>
    </pattern>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Pasarela: cât de sus și cât de rigidă</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Schiță de principiu, fără scară</text>

  <!-- PANOU 1: elevație -->
  <text x="40" y="132" font-size="20" font-weight="700" fill="#1e3a5f">1. Cota față de apele mari</text>
  <!-- maluri -->
  <path d="M40,300 L170,300 L250,470 L40,470 Z" fill="url(#earth)"/>
  <path d="M600,300 L470,300 L390,470 L600,470 Z" fill="url(#earth)"/>
  <!-- apă normală -->
  <path d="M250,470 L390,470 L370,430 L270,430 Z" fill="#93c5fd"/>
  <!-- apă mare -->
  <path d="M195,352 L445,352" stroke="#2563eb" stroke-width="3" stroke-dasharray="12 8"/>
  <path d="M195,352 L445,352 L410,430 L230,430 Z" fill="#bfdbfe" opacity="0.6"/><text x="320" y="378" font-size="15" fill="#1d4ed8" text-anchor="middle">nivel ape mari de calcul</text>
  <!-- pasarela -->
  <rect x="150" y="268" width="340" height="22" fill="#1e3a5f"/><rect x="152" y="290" width="26" height="10" fill="#475569"/><rect x="462" y="290" width="26" height="10" fill="#475569"/>
  <rect x="150" y="248" width="340" height="4" fill="#475569"/>
  <g stroke="#475569" stroke-width="3">
    <line x1="160" y1="252" x2="160" y2="268"/><line x1="240" y1="252" x2="240" y2="268"/><line x1="320" y1="252" x2="320" y2="268"/><line x1="400" y1="252" x2="400" y2="268"/><line x1="480" y1="252" x2="480" y2="268"/>
  </g>
  <!-- cote -->
  <line x1="520" y1="290" x2="520" y2="352" stroke="#0a1628" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="530" y="315" font-size="15" fill="#0a1628">spațiu liber</text>
  <text x="530" y="335" font-size="15" fill="#0a1628">pentru plutitori</text>
  <!-- plutitori -->
  <g fill="#78350f"><rect x="330" y="340" width="46" height="7" rx="3" transform="rotate(-8 353 343)"/><circle cx="300" cy="345" r="5"/></g>
  <text x="40" y="510" font-size="16" fill="#475569">Cota intradosului vine din studiul hidrologic.</text>
  <text x="40" y="532" font-size="16" fill="#475569">Prea jos, pasarela oprește crengile aduse de viitură</text>
  <text x="40" y="554" font-size="16" fill="#475569">și devine baraj.</text>

  <!-- PANOU 2: frecvențe -->
  <text x="660" y="132" font-size="20" font-weight="700" fill="#1e3a5f">2. Frecvența proprie față de pași</text>
  <g font-size="15" fill="#475569" text-anchor="middle">
    <line x1="700" y1="420" x2="1150" y2="420" stroke="#0a1628" stroke-width="2"/>
    <g stroke="#0a1628" stroke-width="2">
      <line x1="700" y1="420" x2="700" y2="428"/><line x1="775" y1="420" x2="775" y2="428"/><line x1="850" y1="420" x2="850" y2="428"/><line x1="925" y1="420" x2="925" y2="428"/><line x1="1000" y1="420" x2="1000" y2="428"/><line x1="1075" y1="420" x2="1075" y2="428"/><line x1="1150" y1="420" x2="1150" y2="428"/>
    </g>
    <text x="700" y="448">0</text><text x="775" y="448">1</text><text x="850" y="448">2</text><text x="925" y="448">3</text><text x="1000" y="448">4</text><text x="1075" y="448">5</text><text x="1150" y="448">6 Hz</text>
  </g>
  <!-- vertical -->
  <text x="700" y="190" font-size="16" font-weight="700" fill="#0a1628">Vertical</text>
  <rect x="700" y="205" width="375" height="40" fill="#fde68a"/>
  <rect x="820" y="205" width="60" height="40" fill="#d97706"/>
  <line x1="1075" y1="195" x2="1075" y2="420" stroke="#b91c1c" stroke-width="3"/>
  <text x="1082" y="232" font-size="15" fill="#b91c1c">5 Hz</text>
  <text x="850" y="268" font-size="14" fill="#b45309" text-anchor="middle">pași ≈ 2 Hz</text>
  <!-- lateral -->
  <text x="700" y="310" font-size="16" font-weight="700" fill="#0a1628">Lateral și torsiune</text>
  <rect x="700" y="325" width="187.5" height="40" fill="#fde68a"/>
  <rect x="745" y="325" width="60" height="40" fill="#d97706"/>
  <line x1="887.5" y1="315" x2="887.5" y2="420" stroke="#b91c1c" stroke-width="3"/>
  <text x="895" y="352" font-size="15" fill="#b91c1c">2,5 Hz</text>
  <text x="775" y="388" font-size="14" fill="#b45309" text-anchor="middle">pași ≈ 1 Hz</text>
  <!-- legendă panou 2 -->
  <g font-size="15" fill="#0a1628">
    <rect x="700" y="480" width="22" height="16" fill="#fde68a"/><text x="730" y="493">sub prag: confortul se verifică (EN 1990, Anexa A2)</text>
    <rect x="700" y="508" width="22" height="16" fill="#d97706"/><text x="730" y="521">zona ritmului obișnuit al pașilor (aproximativ)</text>
    <line x1="700" y1="544" x2="722" y2="544" stroke="#b91c1c" stroke-width="3"/><text x="730" y="549">pragul de frecvență fundamentală</text>
  </g>
  <text x="700" y="590" font-size="16" fill="#475569">Lateral, pasul are jumătate din frecvența verticală:</text>
  <text x="700" y="612" font-size="16" fill="#475569">împingerea laterală își schimbă sensul la fiecare pas.</text>
  <line x1="630" y1="120" x2="630" y2="640" stroke="#e2e8f0" stroke-width="2"/>
</svg>
