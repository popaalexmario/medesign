<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 463.3" font-family="Inter, Arial, sans-serif"><rect width="1200" height="463.3" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Unde duci apa de pe o platformă</text><text x="40" y="82" font-size="17" fill="#64748b">Trei etape, în ordinea din articol</text><rect x="40" y="120" width="326.6666666666667" height="50" rx="12" fill="#334155"/><text x="203.33333333333334" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1. Panta</text><rect x="40" y="180" width="326.6666666666667" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Conduce apa departe de clădire</text><rect x="40" y="234.1" width="326.6666666666667" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Se stabilește odată cu cotele</text><rect x="40" y="288.20000000000005" width="326.6666666666667" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">O platformă fără pantă ține apa</text><text x="58" y="338.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">pe loc</text><text x="401.6666666666667" y="180" font-size="44" font-weight="700" fill="#d97706" text-anchor="middle">→</text><rect x="436.6666666666667" y="120" width="326.6666666666667" height="50" rx="12" fill="#1e3a5f"/><text x="600" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2. Colectarea</text><rect x="436.6666666666667" y="180" width="326.6666666666667" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="454.6666666666667" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rigole și guri de scurgere</text><rect x="436.6666666666667" y="234.1" width="326.6666666666667" height="66.20000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="454.6666666666667" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rigolă carosabilă de-a</text><text x="454.6666666666667" y="284.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">curmezișul accesului</text><rect x="436.6666666666667" y="310.3" width="326.6666666666667" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="454.6666666666667" y="338.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Locurile de adunare se aleg, nu</text><text x="454.6666666666667" y="360.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">se lasă la întâmplare</text><text x="798.3333333333334" y="180" font-size="44" font-weight="700" fill="#d97706" text-anchor="middle">→</text><rect x="833.3333333333334" y="120" width="326.6666666666667" height="50" rx="12" fill="#d97706"/><text x="996.6666666666667" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3. Evacuarea</text><rect x="833.3333333333334" y="180" width="326.6666666666667" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="851.3333333333334" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rețea pluvială, dacă operatorul</text><text x="851.3333333333334" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">o acceptă</text><rect x="833.3333333333334" y="256.2" width="326.6666666666667" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="851.3333333333334" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Emisar: șanț sau curs de apă</text><rect x="833.3333333333334" y="310.3" width="326.6666666666667" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="851.3333333333334" y="338.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Infiltrare, doar pe teren care o</text><text x="851.3333333333334" y="360.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">permite</text><text x="40" y="412.5" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Infiltrarea se decide din studiul geotehnic, nu din ochi.</text></svg>
