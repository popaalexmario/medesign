<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485.4" font-family="Inter, Arial, sans-serif"><rect width="1200" height="485.4" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Are terenul acces la drumul public?</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 159 și 219</text><rect x="40" y="120" width="357.3333333333333" height="50" rx="12" fill="#1e3a5f"/><text x="218.66666666666666" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Acces direct</text><rect x="40" y="180" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Latura terenului dă în drumul</text><text x="58" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">public</text><rect x="40" y="256.2" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Racordul la drum cere acordul</text><text x="58" y="306.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">administratorului</text><rect x="421.3333333333333" y="120" width="357.3333333333333" height="50" rx="12" fill="#334155"/><text x="600" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Acces indirect</text><rect x="421.3333333333333" y="180" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Prin servitute de trecere legal</text><text x="439.3333333333333" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">constituită</text><rect x="421.3333333333333" y="256.2" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Forma juridică o stabilește notarul</text><text x="439.3333333333333" y="306.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">sau avocatul</text><rect x="421.3333333333333" y="332.4" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="360.4" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Lățimea și traseul, după vehiculele</text><text x="439.3333333333333" y="382.5" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">care vor circula</text><rect x="802.6666666666666" y="120" width="357.3333333333333" height="50" rx="12" fill="#d97706"/><text x="981.3333333333333" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Fără acces</text><rect x="802.6666666666666" y="180" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="820.6666666666666" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Terenul nu îndeplinește condiția de</text><text x="820.6666666666666" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">teren construibil</text><rect x="802.6666666666666" y="256.2" width="357.3333333333333" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="820.6666666666666" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">La parcelare, fiecare lot are</text><text x="820.6666666666666" y="306.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">nevoie de acces</text><text x="40" y="434.59999999999997" font-size="16" font-weight="400" fill="#475569" text-anchor="start">O potecă folosită de ani de zile nu e o servitute legal constituită.</text></svg>
