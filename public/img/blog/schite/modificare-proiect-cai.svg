<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 561.5999999999999" font-family="Inter, Arial, sans-serif"><rect width="1200" height="561.5999999999999" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Vrei să schimbi proiectul: ce cale urmezi</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 293</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="159.1" r="17" fill="#d97706"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Înainte de autorizație: modifici proiectul</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">cel mai ieftin moment pentru o revizuire</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="251.29999999999998" r="17" fill="#1e3a5f"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">După autorizație, modificare locală a soluției tehnice</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">dispoziție de șantier, elaborată în prealabil de proiectant (alin. (8))</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Modificare de temă, în limitele avizelor și reglementărilor</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">autorizație de modificare, cu PAC actualizat (alin. (1)–(5))</text><rect x="40" y="396.59999999999997" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="435.7" r="17" fill="#1e3a5f"/><text x="74" y="440.7" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Modificare care iese din limitele avizelor</text><text x="106" y="457.29999999999995" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">autorizarea se reia (alin. (6))</text><text x="40" y="510.79999999999995" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Autorizația de modificare se cere înainte de lucrările modificate și în valabilitatea autorizației inițiale.</text></svg>
