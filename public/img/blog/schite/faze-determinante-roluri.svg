<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485.30000000000007" font-family="Inter, Arial, sans-serif"><rect width="1200" height="485.30000000000007" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Cine face ce la o fază determinantă</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 426, 452, 520 și 570</text><rect x="40" y="120" width="1120" height="46.8" rx="10" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5"/><text x="56" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Cine</text><text x="388.972972972973" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Ce face</text><rect x="40" y="174.8" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="56" y="208.10000000000002" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Proiectantul</text><text x="388.972972972973" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Stabilește prin proiect fazele determinante și participă la verificări</text><rect x="40" y="230.9" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="264.2" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Constructorul</text><text x="388.972972972973" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Convoacă participanții și asigură condițiile de verificare</text><rect x="40" y="287" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="320.3" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Dirigintele și RTE</text><text x="388.972972972973" y="320.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Verifică și semnează procesul-verbal primii</text><rect x="40" y="343.1" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="376.40000000000003" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Proiectantul</text><text x="388.972972972973" y="376.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Semnează după ei; nu răspunde de controlul calității execuției</text><rect x="40" y="399.20000000000005" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="432.50000000000006" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">Contravenții</text><text x="388.972972972973" y="432.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Faze nestabilite în proiect sau neconvocarea verificării</text></svg>
