<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e7dcc8"/><circle cx="4" cy="4" r="1.6" fill="#b8a582"/><circle cx="11" cy="10" r="1.3" fill="#b8a582"/>
    </pattern>
    <pattern id="conc" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#cbd5e1"/><circle cx="5" cy="6" r="1.2" fill="#94a3b8"/><circle cx="12" cy="12" r="1" fill="#94a3b8"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Săpătură la limita proprietății, lângă clădirea vecină</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Schiță de principiu, fără scară. Ce analizează expertiza privind influența asupra vecinătăților.</text>

  <!-- teren -->
  <path d="M40,250 L560,250 L560,400 L900,400 L900,250 L1160,250 L1160,470 L40,470 Z" fill="url(#earth)"/>
  <!-- clădirea vecină -->
  <rect x="140" y="130" width="300" height="120" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <path d="M130,130 L290,90 L450,130 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="140" y="250" width="300" height="40" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <text x="290" y="200" font-size="16" fill="#475569" text-anchor="middle">clădire vecină</text>
  <!-- limita de proprietate -->
  <line x1="520" y1="110" x2="520" y2="470" stroke="#7c2d12" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="520" y="102" font-size="14" fill="#7c2d12" text-anchor="middle">limita de proprietate</text>
  <!-- sprijinirea săpăturii -->
  <rect x="548" y="240" width="12" height="190" fill="#334155"/>
  <!-- zona de influență -->
  <path d="M440,290 L560,400 L560,290 Z" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- platforma / construcția nouă -->
  <rect x="580" y="386" width="300" height="14" fill="#475569"/>
  <text x="730" y="378" font-size="15" fill="#475569" text-anchor="middle">platformă coborâtă sau fundație nouă</text>

  <!-- numere -->
  <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="290" cy="320" r="14" fill="#d97706"/><text x="290" y="325">1</text>
    <circle cx="520" cy="440" r="14" fill="#d97706"/><text x="520" y="445">2</text>
    <circle cx="595" cy="300" r="14" fill="#d97706"/><text x="595" y="305">3</text>
    <circle cx="500" cy="345" r="14" fill="#d97706"/><text x="500" y="350">4</text>
    <circle cx="730" cy="430" r="14" fill="#d97706"/><text x="730" y="435">5</text>
  </g>

  <!-- legenda -->
  <g font-size="15" fill="#334155">
    <text x="40" y="515"><tspan font-weight="700">1</tspan>  Fundația clădirii vecine: tip, adâncime, stare</text>
    <text x="40" y="543"><tspan font-weight="700">2</tspan>  Limita de proprietate: săpătura se face pe terenul tău</text>
    <text x="40" y="571"><tspan font-weight="700">3</tspan>  Sprijinirea săpăturii, dacă e nevoie</text>
    <text x="620" y="515"><tspan font-weight="700">4</tspan>  Zona de teren influențată de săpătură, sub fundația vecină</text>
    <text x="620" y="543"><tspan font-weight="700">5</tspan>  Lucrarea nouă, la cota din proiect</text>
  </g>
  <text x="40" y="604" font-size="13" fill="#64748b">Expertiza stabilește dacă se poate construi fără afectarea clădirii vecine. Proiectul aplică concluziile ei: adâncimea, ordinea și sprijinirea săpăturii.</text>
</svg>
