<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490.2" font-family="Inter, Arial, sans-serif"><rect width="1200" height="490.2" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Ai nevoie de autorizație? Trei întrebări</text><text x="40" y="82" font-size="17" fill="#64748b">Pentru lucrări la infrastructura de transport, după CATUC</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Ce natură are lucrarea, potrivit reglementărilor tehnice?</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">întreținere periodică și reparații curente, în ciclul normal de exploatare, pot intra în regimul fără formalități</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="251.29999999999998" r="17" fill="#d97706"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Atinge structura de rezistență, geometria sau capacitatea portantă?</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">dacă da, e intervenție și cere autorizație: structura rutieră refăcută, profil modificat, structura unui pod</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Unde e amplasată?</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">zone protejate și imobile clasate au regim propriu, mai restrictiv, nu mai permisiv</text><text x="40" y="418.59999999999997" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Exemple care intră de regulă la întreținere: plombări, marcaje, curățarea șanțurilor, semnalizare, întreținerea curentă a podețelor.</text><text x="40" y="439.4" font-size="16" font-weight="400" fill="#475569" text-anchor="start">La cazurile de graniță, întreabă din timp autoritatea emitentă.</text></svg>
