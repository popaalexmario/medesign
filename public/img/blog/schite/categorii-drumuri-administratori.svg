<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 471.0999999999999" font-family="Inter, Arial, sans-serif"><rect width="1200" height="471.0999999999999" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Cine deține și cine administrează drumul</text><text x="40" y="82" font-size="17" fill="#64748b">OG nr. 43/1997 privind regimul drumurilor</text><rect x="40" y="120" width="357.3333333333333" height="50" rx="12" fill="#1e3a5f"/><text x="218.66666666666666" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Drum național</text><rect x="40" y="180" width="357.3333333333333" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Proprietar</text><text x="58" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Statul</text><rect x="40" y="252.29999999999998" width="357.3333333333333" height="84.39999999999996" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Administrator</text><text x="58" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Ministerul Transporturilor, direct</text><text x="58" y="320.59999999999997" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">sau prin CNAIR</text><rect x="40" y="346.69999999999993" width="357.3333333333333" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="374.69999999999993" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Excepție</text><text x="58" y="392.8999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">În intravilanul municipiilor:</text><text x="58" y="414.99999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">consiliul local</text><rect x="421.3333333333333" y="120" width="357.3333333333333" height="50" rx="12" fill="#334155"/><text x="600" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Drum județean</text><rect x="421.3333333333333" y="180" width="357.3333333333333" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Proprietar</text><text x="439.3333333333333" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Județul</text><rect x="421.3333333333333" y="252.29999999999998" width="357.3333333333333" height="62.299999999999955" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Administrator</text><text x="439.3333333333333" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Consiliul județean</text><rect x="421.3333333333333" y="324.5999999999999" width="357.3333333333333" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="439.3333333333333" y="352.5999999999999" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Excepție</text><text x="439.3333333333333" y="370.7999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">În intravilanul localităților</text><text x="439.3333333333333" y="392.8999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">urbane: consiliul local</text><rect x="802.6666666666666" y="120" width="357.3333333333333" height="50" rx="12" fill="#d97706"/><text x="981.3333333333333" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Drum de interes local</text><rect x="802.6666666666666" y="180" width="357.3333333333333" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="820.6666666666666" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Proprietar</text><text x="820.6666666666666" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Comuna, orașul sau municipiul</text><rect x="802.6666666666666" y="252.29999999999998" width="357.3333333333333" height="84.39999999999996" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="820.6666666666666" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Tipuri</text><text x="820.6666666666666" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Comunale, vicinale, străzi, piste</text><text x="820.6666666666666" y="320.59999999999997" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">de biciclete</text><rect x="802.6666666666666" y="346.69999999999993" width="357.3333333333333" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="820.6666666666666" y="374.69999999999993" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Administrator</text><text x="820.6666666666666" y="392.8999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Consiliul local, care îl și</text><text x="820.6666666666666" y="414.99999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">clasifică prin hotărâre</text></svg>
