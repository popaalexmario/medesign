<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 463.3" font-family="Inter, Arial, sans-serif"><rect width="1200" height="463.3" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Hală, depozit sau magazin: ce cere art. 406 din 2027</text><text x="40" y="82" font-size="17" fill="#64748b">Birouri, comerț, industrie, depozitare, de la 1 ianuarie 2027</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Clădirea (lit. b))</text><rect x="40" y="180" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Suprafață construită peste 1.000 mp, inclusiv parcaje</text><text x="58" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">acoperite</text><rect x="40" y="256.2" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Acoperiș verde pe cel puțin jumătate din suprafață</text><rect x="40" y="310.3" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="338.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Condiție pentru autorizare</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Parcarea (lit. c) și d))</text><rect x="612" y="180" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Exterioară, peste 500 mp: infiltrare sau evaporare a</text><text x="630" y="230.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">apei</text><rect x="612" y="256.2" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="284.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Arbori sau umbrire pe cel puțin 30% din suprafață</text><rect x="612" y="310.3" width="548" height="66.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="338.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Umbrirea artificială: cu producere de energie</text><text x="630" y="360.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">regenerabilă</text><text x="40" y="412.5" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Lit. e): excepții pentru patrimoniu sau când cerințele nu se pot îndeplini tehnic și economic.</text></svg>
