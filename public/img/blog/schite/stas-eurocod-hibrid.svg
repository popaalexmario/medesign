<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 401.3999999999999" font-family="Inter, Arial, sans-serif"><rect width="1200" height="401.3999999999999" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Podurile existente: abordarea hibridă</text><text x="40" y="82" font-size="17" fill="#64748b">Metodologia din 20.09.2022, M. Of. nr. 988 bis</text><rect x="40" y="120" width="525" height="50" rx="12" fill="#334155"/><text x="302.5" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Încărcări: convoaiele vechi</text><rect x="40" y="180" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Sursa</text><text x="58" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">STAS 3221-86, clasa E (standard anulat la 31.07.2018)</text><rect x="40" y="252.29999999999998" width="525" height="62.299999999999955" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">De ce</text><text x="58" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Structura a fost concepută pe aceste ipoteze</text><text x="600" y="180" font-size="44" font-weight="700" fill="#d97706" text-anchor="middle">+</text><rect x="635" y="120" width="525" height="50" rx="12" fill="#1e3a5f"/><text x="897.5" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Verificare: Eurocodurile</text><rect x="635" y="180" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Ce se verifică</text><text x="653" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Materialele, beton și metal, după Eurocoduri</text><rect x="635" y="252.29999999999998" width="525" height="62.299999999999955" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">De ce merge</text><text x="653" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Ambele sisteme se bazează pe metoda stărilor limită</text><text x="40" y="350.5999999999999" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Limite: metodologia se aplică numai suprastructurii, în gruparea fundamentală. Siguranța la seism nu e acoperită.</text></svg>
