<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e2e8f0"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#94a3b8" stroke-width="3"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <g id="zebraV"><rect x="0" y="0" width="11" height="26" fill="#fff"/><rect x="20" y="0" width="11" height="26" fill="#fff"/><rect x="40" y="0" width="11" height="26" fill="#fff"/><rect x="60" y="0" width="11" height="26" fill="#fff"/><rect x="80" y="0" width="11" height="26" fill="#fff"/><rect x="100" y="0" width="11" height="26" fill="#fff"/><rect x="120" y="0" width="11" height="26" fill="#fff"/></g>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Elementele unui sens giratoriu</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Schiță de principiu, fără scară. Circulație pe dreapta.</text>

  <g transform="translate(360 425)">
    <rect x="-70" y="-325" width="140" height="650" fill="#cbd5e1"/>
    <rect x="-330" y="-70" width="660" height="140" fill="#cbd5e1"/>
    <circle r="190" fill="#cbd5e1"/>
    <path d="M-10,-325 L10,-325 L24,-200 L-24,-200 Z" fill="#94a3b8"/>
    <path d="M-10,325 L10,325 L24,200 L-24,200 Z" fill="#94a3b8"/>
    <path d="M-330,-10 L-330,10 L-200,24 L-200,-24 Z" fill="#94a3b8"/>
    <path d="M330,-10 L330,10 L200,24 L200,-24 Z" fill="#94a3b8"/>
    <use href="#zebraV" x="-65" y="-285"/>
    <use href="#zebraV" x="-65" y="259"/>
    <use href="#zebraV" transform="translate(-259 -65) rotate(90)"/>
    <use href="#zebraV" transform="translate(285 -65) rotate(90)"/>
    <circle r="108" fill="url(#hatch)"/>
    <circle r="74" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <path d="M38,320 L38,215 C38,175 128,130 128,0 C128,-130 38,-175 38,-215 L38,-318" fill="none" stroke="#d97706" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#ar)"/>
    <g fill="#1e3a5f"><rect x="-198" y="30" width="13" height="13"/><rect x="185" y="-43" width="13" height="13"/><rect x="-43" y="185" width="13" height="13"/></g>

    <g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="0" cy="0" r="17" fill="#1e3a5f"/><text x="0" y="6">1</text>
      <circle cx="-90" cy="-35" r="17" fill="#1e3a5f"/><text x="-90" y="-29">2</text>
      <circle cx="-150" cy="-110" r="17" fill="#1e3a5f"/><text x="-150" y="-104">3</text>
      <circle cx="-100" cy="-272" r="17" fill="#1e3a5f"/><text x="-100" y="-266">4</text>
      <circle cx="0" cy="-250" r="17" fill="#1e3a5f"/><text x="0" y="-244">5</text>
      <circle cx="-170" cy="80" r="17" fill="#1e3a5f"/><text x="-170" y="86">6</text>
      <circle cx="168" cy="-110" r="17" fill="#d97706"/><text x="168" y="-104">7</text>
    </g>
  </g>

  <g font-size="19" fill="#0a1628">
    <g transform="translate(770 170)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="28" y="0">Insula centrală</text>
    </g>
    <g transform="translate(770 225)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="28" y="0">Zonă carosabilă pentru vehicule lungi</text>
      <text x="28" y="24" font-size="15" fill="#64748b">roțile din spate pot călca aici,</text>
      <text x="28" y="44" font-size="15" fill="#64748b">autoturismele o ocolesc</text>
    </g>
    <g transform="translate(770 325)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="28" y="0">Inelul carosabil, 1 sau 2 benzi</text>
    </g>
    <g transform="translate(770 380)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="28" y="0">Trecere de pietoni retrasă de la inel</text>
      <text x="28" y="24" font-size="15" fill="#64748b">un vehicul care iese are loc să oprească</text>
    </g>
    <g transform="translate(770 455)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="28" y="0">Insulă separatoare</text>
      <text x="28" y="24" font-size="15" fill="#64748b">refugiu pentru pietoni, ghidează intrarea</text>
    </g>
    <g transform="translate(770 530)">
      <circle cx="0" cy="-6" r="15" fill="#1e3a5f"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
      <text x="28" y="0">Guri de scurgere pe marginea inelului</text>
    </g>
    <g transform="translate(770 585)">
      <circle cx="0" cy="-6" r="15" fill="#d97706"/><text x="0" y="0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text>
      <text x="28" y="0" fill="#b45309">Gabaritul de virare al vehiculului de calcul</text>
      <text x="28" y="24" font-size="15" fill="#64748b">se trasează pentru cel mai lung vehicul</text>
      <text x="28" y="44" font-size="15" fill="#64748b">care folosește intersecția</text>
    </g>
  </g>
</svg>
