<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612.2999999999998" font-family="Inter, Arial, sans-serif"><rect width="1200" height="612.2999999999998" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Parcările exterioare și art. 406 din CATUC</text><text x="40" y="82" font-size="17" fill="#64748b">Obligațiile din lit. c)–e) și ce rămâne de decis în proiect</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Ce cere legea</text><rect x="40" y="180" width="548" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">De la 1.01.2027</text><text x="58" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Parcări exterioare peste 500 mp: birouri, comerț,</text><text x="58" y="248.29999999999998" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">industrie, depozitare, plus cele noi deschise publicului</text><rect x="40" y="274.4" width="548" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="302.4" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Lit. c)</text><text x="58" y="320.59999999999997" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Dispozitive pentru permeabilitate, infiltrare sau</text><text x="58" y="342.7" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">evaporare a apei pluviale</text><rect x="40" y="368.79999999999995" width="548" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="396.79999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Lit. d)</text><text x="58" y="414.99999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Arbori sau umbrire pe cel puțin 30% din suprafață</text><rect x="40" y="441.0999999999999" width="548" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="469.0999999999999" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Lit. e)</text><text x="58" y="487.2999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Excepții: patrimoniu sau cerințe imposibile tehnic și</text><text x="58" y="509.3999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">economic</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Ce decide proiectul</text><rect x="612" y="180" width="548" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Vehiculele</text><text x="630" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Cel mai greu vehicul decide structura și razele</text><rect x="612" y="252.29999999999998" width="548" height="62.299999999999955" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Terenul</text><text x="630" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Studiul geotehnic spune dacă apa se poate infiltra</text><rect x="612" y="324.5999999999999" width="548" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="352.5999999999999" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Apa</text><text x="630" y="370.7999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Unde ajunge și prin ce e preluată</text><rect x="612" y="396.89999999999986" width="548" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="424.89999999999986" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Accesul și cotele</text><text x="630" y="443.09999999999985" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Racordul la stradă și sistematizarea verticală</text><text x="40" y="561.4999999999999" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Litera d) nu repetă pragul de 500 mp și data: aplicarea se clarifică la certificatul de urbanism.</text></svg>
