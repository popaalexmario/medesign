<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 473.2000000000001" font-family="Inter, Arial, sans-serif"><rect width="1200" height="473.2000000000001" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Drumul dintr-un ansamblu de locuințe</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 219, 528 și definiția drumului privat</text><rect x="40" y="120" width="548" height="50" rx="12" fill="#1e3a5f"/><text x="314" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Ce cere legea</text><rect x="40" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Fiecare lot: acces direct sau indirect la drumul public</text><rect x="40" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Drum dimensionat după regulamente și normative</text><rect x="40" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Acces pentru vehiculele de intervenție</text><rect x="40" y="342.30000000000007" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="370.30000000000007" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Recepția caselor odată cu căile de acces</text><rect x="612" y="120" width="548" height="50" rx="12" fill="#d97706"/><text x="886" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Ce decide proiectul</text><rect x="612" y="180" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="208" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Lățimea și spațiile de întoarcere</text><rect x="612" y="234.1" width="548" height="44.10000000000003" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="262.1" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Scurgerea apei pe toată lungimea</text><rect x="612" y="288.20000000000005" width="548" height="44.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="630" y="316.20000000000005" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Rețelele puse sub drum de la început</text><text x="40" y="422.4000000000001" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Trecerea unui drum privat în proprietatea publică nu e automată.</text></svg>
