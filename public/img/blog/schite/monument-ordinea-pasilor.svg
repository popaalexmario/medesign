<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 703.2" font-family="Inter, Arial, sans-serif"><rect width="1200" height="703.2" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Pod monument istoric: ordinea care economisește timp</text><text x="40" y="82" font-size="17" fill="#64748b">Legea nr. 422/2001 și CATUC</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Verifici statutul în Lista Monumentelor Istorice</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">și dacă podul e în zona de protecție a unui monument</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="251.29999999999998" r="17" fill="#1e3a5f"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Expertiză de la un expert atestat suplimentar pentru monumente</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">art. 436 alin. (2) din CATUC</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="343.5" r="17" fill="#1e3a5f"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Discuți soluția cu direcția județeană pentru cultură</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">înainte să o dezvolți în detaliu</text><rect x="40" y="396.59999999999997" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="435.7" r="17" fill="#d97706"/><text x="74" y="440.7" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Documentația de avizare și avizul Ministerului Culturii</text><text x="106" y="457.29999999999995" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">15 zile pentru lucrări inginerești de interes local și județean</text><rect x="40" y="488.79999999999995" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="527.9" r="17" fill="#1e3a5f"/><text x="74" y="532.9" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="522.8" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Verificare de un verificator atestat suplimentar</text><text x="106" y="549.5" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">art. 440 alin. (5) din CATUC</text><rect x="40" y="581" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="620.1" r="17" fill="#1e3a5f"/><text x="74" y="625.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="106" y="615" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Autorizația de construire</text><text x="106" y="641.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">emisă fără avizul Ministerului Culturii, e nulă de drept</text></svg>
