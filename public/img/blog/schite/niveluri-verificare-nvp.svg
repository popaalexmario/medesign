<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 473.40000000000003" font-family="Inter, Arial, sans-serif"><rect width="1200" height="473.40000000000003" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Patru niveluri de verificare a proiectului</text><text x="40" y="82" font-size="17" fill="#64748b">CATUC, art. 440–444</text><rect x="40" y="120" width="1120" height="46.8" rx="10" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5"/><text x="56" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Clasa</text><text x="252" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Nivel</text><text x="504" y="152.4" font-size="16" font-weight="700" fill="#fff" text-anchor="start">Ce face verificatorul</text><rect x="40" y="174.8" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="208.10000000000002" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">CC1</text><text x="252" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">NVP1</text><text x="504" y="208.10000000000002" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Nu există verificare obligatorie. Răspund proiectanții.</text><rect x="40" y="230.9" width="1120" height="70.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="264.2" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">CC2</text><text x="252" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">NVP2</text><text x="504" y="264.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Verificare calitativă: date de intrare, ipoteze, constructibilitate,</text><text x="504" y="286.3" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">conținutul proiectului.</text><rect x="40" y="309.1" width="1120" height="70.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="342.40000000000003" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">CC3</text><text x="252" y="342.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">NVP3</text><text x="504" y="342.40000000000003" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Plus verificare cantitativă: revizuiește toate calculele</text><text x="504" y="364.50000000000006" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">proiectantului.</text><rect x="40" y="387.3" width="1120" height="48.1" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="56" y="420.6" font-size="17" font-weight="700" fill="#0a1628" text-anchor="start">CC4</text><text x="252" y="420.6" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">NVP4</text><text x="504" y="420.6" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Calcul paralel independent. Diferența față de proiectant: maximum 5%.</text></svg>
