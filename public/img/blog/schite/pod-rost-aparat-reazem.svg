<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e7dcc8"/>
      <circle cx="4" cy="4" r="1.6" fill="#b8a582"/><circle cx="11" cy="10" r="1.3" fill="#b8a582"/>
    </pattern>
    <pattern id="conc" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#cbd5e1"/>
      <circle cx="5" cy="6" r="1.2" fill="#94a3b8"/><circle cx="12" cy="12" r="1" fill="#94a3b8"/>
    </pattern>
    <marker id="wa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Capătul unui pod: unde intră apa</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Secțiune longitudinală prin culee, schiță de principiu, fără scară</text>

  <!-- terasament în spatele culeei -->
  <rect x="40" y="250" width="300" height="430" fill="url(#earth)"/>
  <!-- asfalt pe terasament -->
  <rect x="40" y="232" width="300" height="18" fill="#334155"/>
  <!-- zid de gardă -->
  <rect x="300" y="232" width="40" height="150" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <!-- culee: corp + banchetă -->
  <path d="M300,382 L300,680 L470,680 L470,410 L380,410 L380,382 Z" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <!-- aparat de reazem -->
  <rect x="395" y="388" width="56" height="22" fill="#1e293b"/>
  <rect x="395" y="388" width="56" height="22" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="399" y1="395" x2="447" y2="395" stroke="#64748b" stroke-width="2"/>
  <line x1="399" y1="403" x2="447" y2="403" stroke="#64748b" stroke-width="2"/>
  <!-- tablier: grindă + placă -->
  <rect x="350" y="250" width="810" height="40" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <rect x="380" y="290" width="780" height="98" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <!-- hidroizolație -->
  <rect x="350" y="244" width="810" height="6" fill="#d97706"/>
  <!-- asfalt pe pod -->
  <rect x="350" y="232" width="810" height="12" fill="#334155"/>
  <!-- rost de dilatație (cedat) -->
  <rect x="340" y="226" width="10" height="24" fill="#f8fafc" stroke="#ef4444" stroke-width="2"/>
  <!-- gură de scurgere + tub scurt -->
  <rect x="760" y="230" width="22" height="20" fill="#0f172a"/>
  <rect x="764" y="250" width="14" height="150" fill="#475569"/>
  <!-- apa prin rost -->
  <path d="M345,180 L345,226" stroke="#2563eb" stroke-width="4" marker-end="url(#wa)"/>
  <path d="M345,252 C345,300 360,340 372,378" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#wa)"/>
  <!-- pete de rugină / beton degradat -->
  <g fill="#b45309" opacity="0.75">
    <ellipse cx="365" cy="400" rx="16" ry="8"/>
    <ellipse cx="420" cy="430" rx="22" ry="10"/>
    <ellipse cx="450" cy="470" rx="12" ry="18"/>
  </g>
  <!-- apă din tub pe grindă -->
  <path d="M771,402 C771,430 780,450 790,470" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#wa)"/>
  <g fill="#b45309" opacity="0.6"><ellipse cx="800" cy="384" rx="26" ry="6"/></g>
  <!-- eflorescențe sub placă -->
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
    <ellipse cx="960" cy="390" rx="22" ry="6"/><ellipse cx="1040" cy="390" rx="15" ry="5"/>
  </g>

  <!-- numere -->
  <g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="345" cy="150" r="17" fill="#ef4444"/><text x="345" y="156">1</text>
    <circle cx="560" cy="205" r="17" fill="#d97706"/><text x="560" y="211">2</text>
    <circle cx="423" cy="355" r="17" fill="#1e3a5f"/><text x="423" y="361">3</text>
    <circle cx="520" cy="450" r="17" fill="#b45309"/><text x="520" y="456">4</text>
    <circle cx="771" cy="200" r="17" fill="#1e3a5f"/><text x="771" y="206">5</text>
    <circle cx="1000" cy="430" r="17" fill="#1e3a5f"/><text x="1000" y="436">6</text>
  </g>

  <!-- legendă -->
  <g font-size="18" fill="#0a1628" transform="translate(560 520)">
    <circle cx="0" cy="-6" r="14" fill="#ef4444"/><text x="0" y="0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="26" y="0">Rost de dilatație neetanș: apa cu sare trece prin el</text>
    <circle cx="0" cy="30" r="14" fill="#d97706"/><text x="0" y="36" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="26" y="36">Hidroizolație între placă și asfalt</text>
    <circle cx="0" cy="66" r="14" fill="#1e3a5f"/><text x="0" y="72" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="26" y="72">Aparat de reazem pe bancheta culeei</text>
    <circle cx="0" cy="102" r="14" fill="#b45309"/><text x="0" y="108" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="26" y="108">Beton degradat, armătură corodată sub rost</text>
    <circle cx="0" cy="138" r="14" fill="#1e3a5f"/><text x="0" y="144" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="26" y="144">Gură de scurgere cu tub prea scurt: udă grinda</text>
    <circle cx="300" cy="-6" r="0" fill="none"/>
  </g>
  <g font-size="18" fill="#0a1628" transform="translate(560 700)">
    <circle cx="0" cy="-6" r="14" fill="#1e3a5f"/><text x="0" y="0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="26" y="0">Eflorescențe și pete de umezeală pe intrados</text>
  </g>
</svg>
