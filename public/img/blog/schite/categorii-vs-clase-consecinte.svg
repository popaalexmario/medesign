<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 571.4999999999999" font-family="Inter, Arial, sans-serif"><rect width="1200" height="571.4999999999999" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Din categorii de importanță în clase de consecințe</text><text x="40" y="82" font-size="17" fill="#64748b">Ce s-a schimbat la 25 august 2026</text><rect x="40" y="120" width="525" height="50" rx="12" fill="#334155"/><text x="302.5" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Până acum: punctaj</text><rect x="40" y="180" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Metoda</text><text x="58" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">6 factori × 3 criterii, punctaj 0, 1, 2, 4 sau 6</text><rect x="40" y="252.29999999999998" width="525" height="62.299999999999955" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="280.29999999999995" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">A, excepțională</text><text x="58" y="298.49999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">peste 30 de puncte</text><rect x="40" y="324.5999999999999" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="352.5999999999999" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">B, deosebită</text><text x="58" y="370.7999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">18…29</text><rect x="40" y="396.89999999999986" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="424.89999999999986" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">C, normală</text><text x="58" y="443.09999999999985" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">6…17</text><rect x="40" y="469.1999999999998" width="525" height="62.30000000000004" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58" y="497.1999999999998" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">D, redusă</text><text x="58" y="515.3999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">sub 5</text><text x="600" y="180" font-size="44" font-weight="700" fill="#d97706" text-anchor="middle">→</text><rect x="635" y="120" width="525" height="50" rx="12" fill="#1e3a5f"/><text x="897.5" y="154" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">CATUC: anexa 6</text><rect x="635" y="180" width="525" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="208" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Metoda</text><text x="653" y="226.2" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Încadrarea se face exclusiv după anexa 6 (art. 370</text><text x="653" y="248.29999999999998" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">alin. (16))</text><rect x="635" y="274.4" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="302.4" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Clase</text><text x="653" y="320.59999999999997" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">CC1, CC2, CC3, CC4</text><rect x="635" y="346.69999999999993" width="525" height="84.39999999999999" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="374.69999999999993" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Dacă nu e în anexă</text><text x="653" y="392.8999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Proiectantul o asimilează celei mai apropiate clase</text><text x="653" y="414.99999999999994" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">(art. 370 alin. (17))</text><rect x="635" y="441.0999999999999" width="525" height="62.29999999999998" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="653" y="469.0999999999999" font-size="14" font-weight="600" fill="#64748b" text-anchor="start">Consecință</text><text x="653" y="487.2999999999999" font-size="17" font-weight="400" fill="#0a1628" text-anchor="start">Clasa decide nivelul verificării de proiect</text></svg>
