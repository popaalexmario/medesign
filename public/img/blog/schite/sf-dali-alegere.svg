<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 689" font-family="Inter, Arial, sans-serif"><rect width="1200" height="689" fill="#f8fafc"/><text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">SF sau DALI: drumul unei documentații</text><text x="40" y="82" font-size="17" fill="#64748b">Pentru proiectele rămase sub HG nr. 907/2016</text><rect x="40" y="120" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="159.1" r="17" fill="#1e3a5f"/><text x="74" y="164.1" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="154" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Nota conceptuală și tema de proiectare</text><text x="106" y="180.7" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">beneficiarul spune ce vrea să obțină</text><rect x="40" y="212.2" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="251.29999999999998" r="17" fill="#1e3a5f"/><text x="74" y="256.29999999999995" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="106" y="246.2" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Obiectiv nou → studiu de fezabilitate (SF)</text><text x="106" y="272.9" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">pentru ce nu există încă: drum nou, pod nou</text><rect x="40" y="304.4" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/><circle cx="74" cy="343.5" r="17" fill="#d97706"/><text x="74" y="348.5" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="106" y="338.4" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Construcție existentă → expertiză tehnică, apoi DALI</text><text x="106" y="365.09999999999997" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">expertiza stabilește starea și soluțiile admisibile</text><rect x="40" y="396.59999999999997" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="435.7" r="17" fill="#1e3a5f"/><text x="74" y="440.7" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="106" y="430.59999999999997" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Aprobarea indicatorilor tehnico-economici</text><text x="106" y="457.29999999999995" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">prin hotărâre a autorității deliberative</text><rect x="40" y="488.79999999999995" width="1120" height="78.2" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="527.9" r="17" fill="#1e3a5f"/><text x="74" y="532.9" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="106" y="522.8" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Proiectul tehnic de execuție și documentația pentru autorizare</text><text x="106" y="549.5" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">sub CATUC, DTAC a devenit PAC</text><rect x="40" y="581" width="1120" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="74" cy="613" r="17" fill="#1e3a5f"/><text x="74" y="618" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="106" y="615" font-size="19" font-weight="600" fill="#0a1628" text-anchor="start">Verificarea de proiect, apoi autorizația de construire</text></svg>
