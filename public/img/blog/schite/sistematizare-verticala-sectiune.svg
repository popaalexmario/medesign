<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Arial, sans-serif">
  <defs>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e7dcc8"/><circle cx="4" cy="4" r="1.6" fill="#b8a582"/><circle cx="11" cy="10" r="1.3" fill="#b8a582"/>
    </pattern>
    <pattern id="conc" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#cbd5e1"/><circle cx="5" cy="6" r="1.2" fill="#94a3b8"/><circle cx="12" cy="12" r="1" fill="#94a3b8"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0a1628">Sistematizarea verticală, în secțiune</text>
  <text x="40" y="82" font-size="17" fill="#64748b">Schiță de principiu, fără scară. De la stradă la clădire, cu drumul apei.</text>

  <!-- pământ sub suprafața proiectată -->
  <path d="M40,340 L250,340 L268,340 L290,372 L312,340 L330,340 L470,306 L860,288 L900,288 L900,278 L1160,278 L1160,470 L40,470 Z" fill="url(#earth)"/>

  <!-- strada -->
  <rect x="40" y="328" width="210" height="12" fill="#334155"/>
  <!-- șanțul drumului, cu podeț sub acces -->
  <path d="M250,340 L268,340 L290,372 L312,340 L330,340" fill="none" stroke="#475569" stroke-width="2"/>
  <circle cx="290" cy="352" r="15" fill="url(#conc)" stroke="#64748b" stroke-width="2"/>
  <circle cx="290" cy="352" r="10" fill="#f8fafc"/>
  <path d="M281,357 Q290,361 299,357" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <!-- accesul, peste podeț -->
  <path d="M250,328 L330,328 L470,296 L470,306 L330,338 L250,338 Z" fill="#475569"/>
  <!-- rigola carosabilă la intrare -->
  <rect x="470" y="296" width="22" height="16" fill="url(#conc)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="474" y="300" width="14" height="8" fill="#93c5fd"/>
  <!-- platforma -->
  <path d="M492,296 L900,276 L900,286 L492,306 Z" fill="#475569"/>
  <!-- clădirea -->
  <rect x="900" y="160" width="250" height="118" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <path d="M890,160 L1025,120 L1160,160 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="900" y="272" width="250" height="8" fill="url(#conc)"/>
  <text x="1025" y="225" font-size="16" fill="#475569" text-anchor="middle">clădire</text>

  <!-- terenul natural, înainte de amenajare -->
  <path d="M330,352 C420,346 520,326 620,312 C720,298 820,262 900,250 C980,238 1080,236 1160,232" fill="none" stroke="#7c2d12" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="345" font-size="14" fill="#7c2d12" text-anchor="middle">teren natural</text>

  <!-- panta și apa -->
  <line x1="820" y1="262" x2="560" y2="275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="690" y="254" font-size="14" fill="#1d4ed8" text-anchor="middle">pantă spre rigolă</text>
  <path d="M481,318 C481,360 440,400 380,410" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="372" y="432" font-size="14" fill="#1d4ed8" text-anchor="end">spre șanț absorbant / emisar</text>

  <!-- cota ±0,00 -->
  <line x1="880" y1="272" x2="880" y2="286" stroke="#d97706" stroke-width="2"/>
  <line x1="872" y1="272" x2="888" y2="272" stroke="#d97706" stroke-width="2"/>
  <line x1="872" y1="286" x2="888" y2="286" stroke="#d97706" stroke-width="2"/>

  <!-- numere -->
  <g font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="140" cy="300" r="14" fill="#d97706"/><text x="140" y="305">1</text>
    <circle cx="290" cy="400" r="14" fill="#d97706"/><text x="290" y="405">2</text>
    <circle cx="400" cy="282" r="14" fill="#d97706"/><text x="400" y="287">3</text>
    <circle cx="481" cy="270" r="14" fill="#d97706"/><text x="481" y="275">4</text>
    <circle cx="700" cy="306" r="14" fill="#d97706"/><text x="700" y="311" fill="#fff">5</text>
    <circle cx="860" cy="246" r="14" fill="#d97706"/><text x="860" y="251">6</text>
  </g>

  <!-- legenda -->
  <g font-size="15" fill="#334155">
    <text x="40" y="510"><tspan font-weight="700">1</tspan>  Strada: cota ei e impusă, nu se discută</text>
    <text x="40" y="538"><tspan font-weight="700">2</tspan>  Șanțul drumului, păstrat printr-un podeț sub acces</text>
    <text x="40" y="566"><tspan font-weight="700">3</tspan>  Accesul, cu pantă pe care o pot urca vehiculele</text>
    <text x="620" y="510"><tspan font-weight="700">4</tspan>  Rigolă carosabilă: apa din incintă nu ajunge în stradă</text>
    <text x="620" y="538"><tspan font-weight="700">5</tspan>  Platforma, cu pantă spre rigolă, niciodată zero</text>
    <text x="620" y="566"><tspan font-weight="700">6</tspan>  Cota ±0,00 a clădirii, peste platformă</text>
  </g>
  <text x="40" y="612" font-size="13" fill="#64748b">Linia întreruptă: terenul natural. Unde e deasupra platformei se sapă, unde e dedesubt se umple. Bilanțul celor două decide o parte importantă din cost.</text>
</svg>
